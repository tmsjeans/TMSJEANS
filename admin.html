<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TMSJEANS Admin</title>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#f4f4f4;
      color:#111;
    }

    header{
      background:#111;
      color:#fff;
      padding:18px 22px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header h1{
      margin:0;
      font-size:21px;
    }

    header button{
      border:0;
      background:#fff;
      color:#111;
      padding:10px 15px;
      border-radius:9px;
      cursor:pointer;
      font-weight:700;
    }

    .container{
      max-width:1150px;
      margin:25px auto;
      padding:0 15px;
    }

    /* LOGIN */

    #loginSection{
      max-width:420px;
      margin:70px auto;
      background:#fff;
      padding:28px;
      border-radius:18px;
      box-shadow:0 12px 40px rgba(0,0,0,.10);
    }

    #loginSection h2{
      margin-top:0;
      margin-bottom:8px;
    }

    #loginSection p{
      color:#666;
      font-size:14px;
      line-height:1.5;
    }

    input,
    select{

      width:100%;

      padding:13px;

      border:1px solid #ddd;

      border-radius:10px;

      outline:none;

      font-size:14px;

      margin-top:8px;

    }

    .primary{
      width:100%;
      border:0;
      background:#111;
      color:#fff;
      padding:13px;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
      margin-top:12px;
    }

    #loginMessage{
      font-size:13px;
      margin-top:10px;
    }

    /* DASHBOARD */

    #dashboard{
      display:none;
    }

    .stats{

      display:grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:15px;

      margin-bottom:20px;

    }

    .stat{

      background:#fff;

      padding:20px;

      border-radius:15px;

      box-shadow:
        0 5px 20px rgba(0,0,0,.06);

    }

    .stat small{

      color:#777;

      display:block;

    }

    .stat strong{

      font-size:28px;

      display:block;

      margin-top:8px;

    }

    .search{

      margin-bottom:20px;

    }

    .order{

      background:#fff;

      padding:20px;

      border-radius:15px;

      margin-bottom:16px;

      box-shadow:
        0 5px 20px rgba(0,0,0,.06);

    }

    .order-header{

      display:flex;

      justify-content:space-between;

      align-items:flex-start;

      gap:15px;

      margin-bottom:15px;

    }

    .order-id{

      font-size:18px;

      font-weight:800;

    }

    .order-date{

      font-size:12px;

      color:#777;

      margin-top:4px;

    }

    .status{

      min-width:160px;

      margin:0;

    }

    .customer{

      display:grid;

      grid-template-columns:
        repeat(2,1fr);

      gap:10px 20px;

      padding:15px 0;

      border-top:1px solid #eee;

      border-bottom:1px solid #eee;

      font-size:14px;

    }

    .customer div{

      line-height:1.5;

    }

    .customer-full{

      grid-column:1/-1;

    }

    .items{

      padding-top:15px;

    }

    .item{

      display:flex;

      justify-content:space-between;

      padding:7px 0;

      font-size:14px;

      border-bottom:1px solid #f3f3f3;

    }

    .total{

      font-size:19px;

      font-weight:800;

      margin-top:15px;

    }

    .empty{

      background:#fff;

      padding:35px;

      text-align:center;

      border-radius:15px;

      color:#777;

    }

    .error-box{

      background:#fff1f1;

      color:#a40000;

      padding:14px;

      border-radius:10px;

      margin-bottom:15px;

      font-size:13px;

      display:none;

    }

    @media(max-width:700px){

      .stats{

        grid-template-columns:1fr;

      }

      .customer{

        grid-template-columns:1fr;

      }

      .customer-full{

        grid-column:auto;

      }

      .order-header{

        flex-direction:column;

      }

      .status{

        width:100%;

      }

      header h1{

        font-size:17px;

      }

    }

  </style>

</head>


<body>

<header>

  <h1>
    TMSJEANS Admin Dashboard
  </h1>

  <button
    id="logoutBtn"
    style="display:none;"
  >
    Logout
  </button>

</header>


<!-- =========================
     LOGIN
========================= -->

<section
  id="loginSection"
>

  <h2>
    Admin Login
  </h2>

  <p>
    Login using the TMSJEANS admin account.
  </p>


  <input
    id="adminEmail"
    type="email"
    placeholder="Admin Email"
    autocomplete="email"
  >


  <input
    id="adminPassword"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
  >


  <button
    id="loginBtn"
    class="primary"
  >
    Login
  </button>


  <div
    id="loginMessage"
  ></div>

</section>


<!-- =========================
     DASHBOARD
========================= -->

<section
  id="dashboard"
  class="container"
>

  <div
    id="databaseError"
    class="error-box"
  ></div>


  <div
    class="stats"
  >

    <div class="stat">

      <small>
        Total Orders
      </small>

      <strong
        id="totalOrders"
      >
        0
      </strong>

    </div>


    <div class="stat">

      <small>
        New Orders
      </small>

      <strong
        id="newOrders"
      >
        0
      </strong>

    </div>


    <div class="stat">

      <small>
        Total Sales
      </small>

      <strong
        id="totalSales"
      >
        ₹0
      </strong>

    </div>

  </div>


  <div class="search">

    <input
      id="searchInput"
      type="search"
      placeholder="Search order ID, name, phone or email..."
    >

  </div>


  <div
    id="ordersList"
  ></div>

</section>


<!-- =========================
     FIREBASE
========================= -->

<script
  src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"
></script>

<script
  src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"
></script>

<script
  src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"
></script>


<script>

  /* =====================================================
     FIREBASE CONFIG
  ===================================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyAxYqY7V2_h5FBCa4Cm9xX5pABu-oAUzg4",

    authDomain:
      "tmsjeans.firebaseapp.com",

    projectId:
      "tmsjeans",

    storageBucket:
      "tmsjeans.firebasestorage.app",

    messagingSenderId:
      "155013489437",

    appId:
      "1:155013489437:web:d1f91792dd8ebba29cf7f4",

    databaseURL:
      "https://tmsjeans-default-rtdb.firebaseio.com"

  };


  /* =====================================================
     ADMIN EMAIL
  ===================================================== */

  const ADMIN_EMAIL =
    "Pandeyji120ji@gmail.com";


  /* =====================================================
     INITIALIZE
  ===================================================== */

  firebase.initializeApp(
    firebaseConfig
  );


  const auth =
    firebase.auth();


  const db =
    firebase.database();


  let allOrders = [];


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const loginSection =
    document.getElementById(
      "loginSection"
    );


  const dashboard =
    document.getElementById(
      "dashboard"
    );


  const logoutBtn =
    document.getElementById(
      "logoutBtn"
    );


  const loginBtn =
    document.getElementById(
      "loginBtn"
    );


  const loginMessage =
    document.getElementById(
      "loginMessage"
    );


  /* =====================================================
     SHOW MESSAGE
  ===================================================== */

  function showLoginMessage(
    message,
    error = false
  ){

    loginMessage.textContent =
      message;

    loginMessage.style.color =
      error
        ? "#b00020"
        : "#16803c";

  }


  /* =====================================================
     AUTH STATE
  ===================================================== */

  auth.onAuthStateChanged(
    user => {

      if(!user){

        showLoginScreen();

        return;

      }


      if(
        (
          user.email || ""
        ).toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
      ){

        showLoginMessage(
          "This account is not authorized for admin access.",
          true
        );

        auth.signOut();

        return;

      }


      showDashboard();

    }
  );


  /* =====================================================
     SHOW LOGIN
  ===================================================== */

  function showLoginScreen(){

    loginSection.style.display =
      "block";

    dashboard.style.display =
      "none";

    logoutBtn.style.display =
      "none";

  }


  /* =====================================================
     SHOW DASHBOARD
  ===================================================== */

  function showDashboard(){

    loginSection.style.display =
      "none";

    dashboard.style.display =
      "block";

    logoutBtn.style.display =
      "block";

    loadOrders();

  }


  /* =====================================================
     LOGIN
  ===================================================== */

  loginBtn.onclick =
    async () => {

      const email =
        document
          .getElementById(
            "adminEmail"
          )
          .value
          .trim();


      const password =
        document
          .getElementById(
            "adminPassword"
          )
          .value;


      if(!email ||
         !password){

        showLoginMessage(
          "Please enter email and password.",
          true
        );

        return;

      }


      if(
        email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
      ){

        showLoginMessage(
          "Unauthorized admin email.",
          true
        );

        return;

      }


      showLoginMessage(
        "Logging in..."
      );


      try{

        await auth
          .signInWithEmailAndPassword(
            email,
            password
          );

      }

      catch(error){

        console.error(
          error
        );

        showLoginMessage(
          "Login failed. Please check your email and password.",
          true
        );

      }

    };


  /* =====================================================
     LOGOUT
  ===================================================== */

  logoutBtn.onclick =
    async () => {

      try{

        await auth.signOut();

      }

      catch(error){

        console.error(
          error
        );

      }

    };


  /* =====================================================
     LOAD ORDERS
  ===================================================== */

  function loadOrders(){

    db.ref("orders")
      .on(
        "value",

        snapshot => {

          const data =
            snapshot.val() ||
            {};


          allOrders = [];


          Object.keys(data)
            .forEach(
              uid => {

                const customerOrders =
                  data[uid] ||
                  {};


                Object.keys(
                  customerOrders
                )
                .forEach(
                  orderId => {

                    allOrders.push(
                      customerOrders[
                        orderId
                      ]
                    );

                  }
                );

              }
            );


          allOrders.sort(
            (a,b) =>

              new Date(
                b.createdAt || 0
              ) -

              new Date(
                a.createdAt || 0
              )

          );


          updateStats();

          renderOrders(
            allOrders
          );

        },

        error => {

          console.error(
            error
          );


          const errorBox =
            document.getElementById(
              "databaseError"
            );


          errorBox.style.display =
            "block";


          errorBox.textContent =
            "Orders could not be loaded. Firebase Database Rules are probably blocking admin access.";

        }
      );

  }


  /* =====================================================
     STATS
  ===================================================== */

  function updateStats(){

    const total =
      allOrders.length;


    const newCount =
      allOrders.filter(
        order =>
          (
            order.status ||
            "New"
          ).toLowerCase() ===
          "new"
      ).length;


    const sales =
      allOrders.reduce(
        (sum,order) =>

          sum +
          Number(
            order.total || 0
          ),

        0
      );


    document
      .getElementById(
        "totalOrders"
      )
      .textContent =
      total;


    document
      .getElementById(
        "newOrders"
      )
      .textContent =
      newCount;


    document
      .getElementById(
        "totalSales"
      )
      .textContent =

      "₹" +

      sales.toLocaleString(
        "en-IN"
      );

  }


  /* =====================================================
     RENDER ORDERS
  ===================================================== */

  function renderOrders(
    orders
  ){

    const list =
      document.getElementById(
        "ordersList"
      );


    if(!orders.length){

      list.innerHTML =
        `

        <div class="empty">

          No orders found.

        </div>

        `;

      return;

    }


    list.innerHTML =

      orders
        .map(
          order =>
            `

            <div
              class="order"
            >

              <div
                class="order-header"
              >

                <div>

                  <div
                    class="order-id"
                  >
                    📦 ${escapeHtml(
                      order.id
                    )}
                  </div>

                  <div
                    class="order-date"
                  >
                    ${formatDate(
                      order.createdAt
                    )}
                  </div>

                </div>


                <select
                  class="status"
                  onchange="
                    updateOrderStatus(
                      '${escapeAttr(
                        order.uid
                      )}',
                      '${escapeAttr(
                        order.id
                      )}',
                      this.value
                    )
                  "
                >

                  ${getStatusOptions(
                    order.status
                  )}

                </select>

              </div>


              <div
                class="customer"
              >

                <div>
                  <strong>Name:</strong><br>
                  ${escapeHtml(
                    order.customer?.name
                  )}
                </div>


                <div>
                  <strong>Phone:</strong><br>
                  ${escapeHtml(
                    order.customer?.phone
                  )}
                </div>


                <div>
                  <strong>Email:</strong><br>
                  ${escapeHtml(
                    order.customer?.email
                  )}
                </div>


                <div>
                  <strong>Payment:</strong><br>
                  ${escapeHtml(
                    order.payment
                  )}
                </div>


                <div>
                  <strong>City:</strong><br>
                  ${escapeHtml(
                    order.customer?.city
                  )}
                </div>


                <div>
                  <strong>PIN:</strong><br>
                  ${escapeHtml(
                    order.customer?.pin
                  )}
                </div>


                <div
                  class="customer-full"
                >
                  <strong>Address:</strong><br>
                  ${escapeHtml(
                    order.customer?.address
                  )}
                </div>

              </div>


              <div
                class="items"
              >

                ${
                  (
                    order.items ||
                    []
                  )
                  .map(
                    item =>
                      `

                      <div
                        class="item"
                      >

                        <span>

                          ${escapeHtml(
                            item.name
                          )}

                          ×

                          ${Number(
                            item.qty || 0
                          )}

                        </span>


                        <strong>

                          ₹${(
                            Number(
                              item.price || 0
                            ) *

                            Number(
                              item.qty || 0
                            )
                          ).toLocaleString(
                            "en-IN"
                          )}

                        </strong>

                      </div>

                      `
                  )
                  .join("")
                }

              </div>


              <div
                class="total"
              >

                Total:
                ₹${Number(
                  order.total || 0
                ).toLocaleString(
                  "en-IN"
                )}

              </div>

            </div>

            `
        )
        .join("");

  }


  /* =====================================================
     STATUS OPTIONS
  ===================================================== */

  function getStatusOptions(
    current
  ){

    const statuses = [

      "New",

      "Confirmed",

      "Packed",

      "Shipped",

      "Delivered",

      "Cancelled"

    ];


    return statuses
      .map(
        status =>
          `

          <option
            value="${status}"

            ${
              (
                current ||
                "New"
              ) === status
                ? "selected"
                : ""
            }

          >

            ${status}

          </option>

          `
      )
      .join("");

  }


  /* =====================================================
     UPDATE STATUS
  ===================================================== */

  async function updateOrderStatus(
    uid,
    orderId,
    status
  ){

    if(
      !uid ||
      !orderId
    ){

      return;

    }


    try{

      await db
        .ref(
          "orders/" +
          uid +
          "/" +
          orderId +
          "/status"
        )
        .set(
          status
        );

    }

    catch(error){

      console.error(
        error
      );

      alert(
        "Status update failed. Check Firebase Database Rules."
      );

    }

  }


  /* =====================================================
     SEARCH
  ===================================================== */

  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "input",

      event => {

        const query =
          event.target.value
            .toLowerCase()
            .trim();


        if(!query){

          renderOrders(
            allOrders
          );

          return;

        }


        const filtered =
          allOrders.filter(
            order => {

              const text =

                String(
                  order.id ||
                  ""
                )

                + " " +

                String(
                  order.customer?.name ||
                  ""
                )

                + " " +

                String(
                  order.customer?.phone ||
                  ""
                )

                + " " +

                String(
                  order.customer?.email ||
                  ""
                );


              return text
                .toLowerCase()
                .includes(
                  query
                );

            }
          );


        renderOrders(
          filtered
        );

      }
    );


  /* =====================================================
     HELPERS
  ===================================================== */

  function escapeHtml(
    value
  ){

    return String(
      value ?? "-"
    )

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function escapeAttr(
    value
  ){

    return String(
      value ?? ""
    )
      .replaceAll(
        "'",
        "\\'"
      );

  }


  function formatDate(
    value
  ){

    if(!value)
      return "-";


    const date =
      new Date(
        value
      );


    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return "-";

    }


    return date.toLocaleString(
      "en-IN"
    );

  }

</script>

</body>
</html>
