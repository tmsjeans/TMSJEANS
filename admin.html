<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMSJEANS — Admin Panel</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:"Inter",Arial,sans-serif;
      background:#080808;
      color:#fff;
      min-height:100vh;
    }

    button,
    input,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar{
      height:76px;
      padding:0 42px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,.08);
      background:#090909;
      position:sticky;
      top:0;
      z-index:20;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-size:24px;
      font-weight:800;
      letter-spacing:-1px;
    }

    .crown{
      font-size:25px;
    }

    .brand span:last-child{
      color:#ff3150;
    }

    .top-links{
      display:flex;
      gap:34px;
      color:#aaa;
      font-size:13px;
      letter-spacing:2px;
      text-transform:uppercase;
    }

    .admin-badge{
      border:1px solid #ff3150;
      color:#ff3150;
      padding:11px 17px;
      border-radius:10px;
      font-size:12px;
      font-weight:800;
      letter-spacing:1.5px;
      background:rgba(255,49,80,.05);
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen{
      min-height:calc(100vh - 76px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:50px 25px;
      position:relative;
      overflow:hidden;
      background:
        radial-gradient(
          circle at 10% 80%,
          rgba(255,49,80,.12),
          transparent 35%
        ),
        radial-gradient(
          circle at 90% 20%,
          rgba(255,49,80,.09),
          transparent 35%
        ),
        #090909;
    }

    #loginScreen::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(
          115deg,
          transparent 0 55%,
          rgba(255,49,80,.035) 55% 100%
        );
      pointer-events:none;
    }

    .login-wrap{
      width:min(1100px,100%);
      display:grid;
      grid-template-columns:1fr 430px;
      gap:60px;
      align-items:center;
      position:relative;
      z-index:2;
    }

    .hero-copy{
      padding:20px;
    }

    .eyebrow{
      font-size:12px;
      letter-spacing:5px;
      color:#aaa;
      text-transform:uppercase;
      margin-bottom:18px;
    }

    .hero-copy h1{
      font-size:clamp(58px,8vw,105px);
      line-height:.9;
      letter-spacing:-6px;
      margin-bottom:20px;
    }

    .hero-copy h1 .red{
      color:#ff3150;
    }

    .hero-sub{
      font-size:18px;
      color:#aaa;
      max-width:530px;
      line-height:1.7;
    }

    .feature-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-top:35px;
      max-width:650px;
    }

    .feature{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.025);
      padding:18px 10px;
      border-radius:12px;
      text-align:center;
    }

    .feature-icon{
      font-size:22px;
      color:#ff3150;
      margin-bottom:8px;
    }

    .feature-title{
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:1.5px;
      color:#ddd;
    }

    .login-card{
      border:1px solid rgba(255,255,255,.16);
      border-radius:24px;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.07),
          rgba(255,255,255,.02)
        );
      padding:36px;
      box-shadow:
        0 30px 80px rgba(0,0,0,.5),
        0 0 50px rgba(255,49,80,.08);
      backdrop-filter:blur(18px);
    }

    .login-icon{
      width:82px;
      height:82px;
      margin:0 auto 20px;
      border-radius:50%;
      border:1px solid #ff3150;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:34px;
      box-shadow:0 0 35px rgba(255,49,80,.15);
    }

    .login-card h2{
      text-align:center;
      font-size:32px;
      margin-bottom:8px;
    }

    .login-card > p{
      text-align:center;
      color:#9a9a9a;
      font-size:14px;
      margin-bottom:25px;
    }

    .google-btn{
      width:100%;
      border:0;
      background:#fff;
      color:#111;
      border-radius:14px;
      min-height:58px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      font-weight:800;
      transition:.2s ease;
    }

    .google-btn:hover{
      transform:translateY(-1px);
      box-shadow:0 12px 30px rgba(0,0,0,.25);
    }

    .google-logo{
      font-size:22px;
    }

    .authorized{
      margin-top:18px;
      border:1px solid rgba(255,255,255,.11);
      border-radius:13px;
      padding:16px;
      background:rgba(255,255,255,.025);
    }

    .authorized small{
      display:block;
      color:#888;
      margin-bottom:5px;
    }

    .authorized strong{
      color:#eee;
      word-break:break-word;
