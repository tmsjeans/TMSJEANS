<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TMSJEANS Admin</title>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#f4f4f4;
      color:#111;
    }

    header{
      background:#111;
      color:#fff;
      padding:18px 22px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header h1{
      margin:0;
      font-size:21px;
    }

    header button{
      border:0;
      background:#fff;
      color:#111;
      padding:10px 15px;
      border-radius:9px;
      cursor:pointer;
      font-weight:700;
      display:none;
    }

    .container{
      max-width:1150px;
      margin:25px auto;
      padding:0 15px;
    }

    #loginSection{
      max-width:420px;
      margin:80px auto;
      background:#fff;
      padding:30px;
      border-radius:18px;
      box-shadow:0 12px 40px rgba(0,0,0,.10);
      text-align:center;
    }

    #loginSection h2{
      margin-top:0;
    }

    #loginSection p{
      color:#666;
      font-size:14px;
      line-height:1.5;
    }

    #googleLoginBtn{
      width:100%;
      border:1px solid #ddd;
      background:#fff;
      color:#111;
      padding:13px;
      border-radius:10px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      margin-top:15px;
    }

    #loginMessage{
      margin-top:12px;
      font-size:13px;
    }

    #dashboard{
      display:none;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:15px;
      margin-bottom:20px;
    }

    .stat{
      background:#fff;
      padding:20px;
      border-radius:15px;
      box-shadow:0 5px 20px rgba(0,0,0,.06);
    }

    .stat small{
      color:#777;
    }

    .stat strong{
      display:block;
      margin-top:8px;
      font-size:28px;
    }

    #searchInput{
      width:100%;
      padding:13px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:14px;
      outline:none;
      margin-bottom:20px;
    }

    .order{
      background:#fff;
      padding:20px;
      border-radius:15px;
      margin-bottom:16px;
      box-shadow:0 5px 20px rgba(0,0,0,.06);
    }

    .order-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:15px;
      margin-bottom:15px;
    }

    .order-id{
      font-size:18px;
      font-weight:800;
    }

    .order-date{
      font-size:12px;
      color:#777;
      margin-top:4px;
    }

    .status{
      min-width:160px;
      padding:10px;
      border:1px solid #ddd;
      border-radius:9px;
      background:#fff;
    }

    .customer{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px 20px;
      padding:15px 0;
      border-top:1px solid #eee;
      border-bottom:1px solid #eee;
      font-size:14px;
    }

    .customer-full{
      grid-column:1/-1;
    }

    .items{
      padding-top:15px;
    }

    .item{
      display:flex;
      justify-content:space-between;
      padding:7px 0;
      font-size:14px;
      border-bottom:1px solid #f2f2f2;
    }

    .total{
      font-size:19px;
      font-weight:800;
      margin-top:15px;
    }

    .empty{
      background:#fff;
      padding:35px;
      text-align:center;
      border-radius:15px;
      color:#777;
    }

    .error-box{
      background:#fff1f1;
      color:#a40000;
      padding:14px;
      border-radius:10px;
      margin-bottom:15px;
      font-size:13px;
      display:none;
    }

    @media(max-width:700px){

      .stats{
        grid-template-columns:1fr;
      }

      .customer{
        grid-template-columns:1fr;
      }

      .customer-full{
        grid-column:auto;
      }

      .order-header{
        flex-direction:column;
      }

      .status{
        width:100%;
      }

      header h1{
        font-size:17px;
      }

    }

  </style>

</head>


<body>


<header>

  <h1>
    TMSJEANS Admin Dashboard
  </h1>

  <button id="logoutBtn">
    Logout
  </button>

</header>


<!-- LOGIN -->

<section id="loginSection">

  <h2>
    TMSJEANS Admin
  </h2>

  <p>
    Admin access is restricted to the authorized Google account.
  </p>

  <button
    id="googleLoginBtn"
  >
    🔐 Continue with Google
  </button>

  <div id="loginMessage"></div>

</section>


<!-- DASHBOARD -->

<section
  id="dashboard"
  class="container"
>

  <div
    id="databaseError"
    class="error-box"
  ></div>


  <div class="stats">

    <div class="stat">

      <small>
        Total Orders
      </small>

      <strong id="totalOrders">
        0
      </strong>

    </div>


    <div class="stat">

      <small>
        New Orders
      </small>

      <strong id="newOrders">
        0
      </strong>

    </div>


    <div class="stat">

      <small>
        Total Sales
      </small>

      <strong id="totalSales">
        ₹0
      </strong>

    </div>

  </div>


  <input
    id="searchInput"
    type="search"
    placeholder="Search order ID, name, phone or email..."
  >


  <div id="ordersList"></div>

</section>

  /* ================================
     ADMIN EMAIL
  ================================= */

  const ADMIN_EMAIL =
    "Pandeyji120ji@gmail.com";


  /* ================================

  ================================= */

  firebase.initializeApp(
    firebaseConfig
  );


  const auth =
    firebase.auth();


  const db =
    firebase.database();

  /* ================================
     MESSAGE
  ================================= */

  function showMessage(
    text,
    error = false
  ){

    const box =
      document.getElementById(
        "loginMessage"
      );


    box.textContent =
      text;


    box.style.color =
      error
        ? "#b00020"
        : "#16803c";

  }


  /* ================================
     AUTH STATE
  ================================= */

  auth.onAuthStateChanged(
    user => {

      if(!user){

        showLogin();

        return;

      }


      const email =
        (
          user.email || ""
        ).toLowerCase();


      if(
        email !==
        ADMIN_EMAIL.toLowerCase()
      ){

        showMessage(
          "This Google account is not authorized.",
          true
        );


        auth.signOut();

        return;

      }


      showDashboard();

    }
  );


  /* ================================
     GOOGLE LOGIN
  ================================= */

  document
    .getElementById(
      "googleLoginBtn"
    )
    .onclick = async () => {

      try{

        showMessage(
          "Opening Google login..."
        );


        const provider =
          new firebase
            .auth
            .GoogleAuthProvider();


        provider.setCustomParameters({
          login_hint:
            ADMIN_EMAIL
        });


        const result =
          await auth
            .signInWithPopup(
              provider
            );


        const user =
          result.user;


        if(
          (
            user.email || ""
          ).toLowerCase() !==
          ADMIN_EMAIL.toLowerCase()
        ){

          await auth.signOut();


          showMessage(
            "This Google account is not authorized for admin access.",
            true
          );


          return;

        }


        showDashboard();

      }

      catch(error){

        console.error(
          error
        );


        if(
          error.code ===
          "auth/popup-blocked"
        ){

          showMessage(
            "Popup was blocked. Allow popups for this website.",
            true
          );

        }

        else if(
          error.code ===
          "auth/popup-closed-by-user"
        ){

          showMessage(
            "Google login was cancelled.",
            true
          );

        }

        else{

          showMessage(
            "Google login failed. Please try again.",
            true
          );

        }

      }

    };

     SHOW LOGIN
